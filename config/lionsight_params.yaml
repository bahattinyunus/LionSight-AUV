# LionSight-AUV Configuration File
# All units in SI unless specified

# Perception Parameters
perception:
  detection:
    model_path: "models/lionsight_yolo_v11.engine"
    confidence_threshold: 0.85
    nms_threshold: 0.45
    input_size: [640, 640]
  
  stereo:
    baseline: 0.12  # meters
    focal_length: 400  # pixels
    sea_thru:
      alpha: 0.05  # attenuation coefficient
      beta: 0.02   # backscatter coefficient

# Navigation Parameters
navigation:
  slam:
    map_resolution: 0.05  # meters per cell
    max_range: 10.0  # meters
  
  path_planning:
    algorithm: "rrt_star"
    max_iterations: 500
    step_size: 0.5  # meters
    goal_tolerance: 0.3  # meters

# Control Parameters
control:
  pid:
    depth:
      kp: 10.0
      ki: 0.1
      kd: 5.0
    roll:
      kp: 5.0
      ki: 0.0
      kd: 2.0
    pitch:
      kp: 5.0
      ki: 0.0
      kd: 2.0
    yaw:
      kp: 8.0
      ki: 0.1
      kd: 3.0
  
  thrusters:
    count: 6
    max_thrust: 5.0  # Newtons
    layout: "vectored_h_frame"

# Mission Parameters
mission:
  default_depth: 1.0  # meters
  search_pattern: "lawn_mower"
  track_distance: 2.0  # meters from target
  safety_depth: 0.5  # minimum depth
